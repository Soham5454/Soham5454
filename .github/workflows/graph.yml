name: Generate Activity Graph

on:
  schedule:
    - cron: '0 0 * * *'   # runs once daily at midnight UTC
  workflow_dispatch:        # lets you trigger it manually from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Ashutosh00710/github-readme-activity-graph@v2.1.6
        with:
          github_username: soham5454
          theme: react-dark
          hide_border: true
          bg_color: 0D1117
          color: FF6E96
          line: FF6E96
          point: FFFFFF
          output: github-contribution-grid-graph.svg
